// 为 jni 等需要 NDK 的插件提供 ndkVersion 属性（在子项目评估前注入）
// CI 中 __NDK_VERSION__ 会被替换为实际安装的 NDK 版本
rootProject.ext.ndkVersion = "__NDK_VERSION__"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("../build"))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
}
// 为旧版 Flutter 插件注入 flutter 扩展属性（AGP 8.9+ 不再自动注入），
// 解决 package_info_plus 等插件引用 flutter.compileSdkVersion 报错的问题。
// 注意：:app 由 Flutter Gradle Plugin 自行创建 flutter 扩展，不能覆盖。
subprojects {
    if (project.name != "app" && !project.hasProperty("flutter")) {
        project.ext["flutter"] = [
            compileSdkVersion: 36,
            minSdkVersion    : 21,
            targetSdkVersion : 36,
            ndkVersion       : "__NDK_VERSION__",
        ]
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

// 为所有 Android 子项目（含 Flutter 插件）统一 compileSdk：
// 旧插件自报 34/35，与新版 AndroidX 依赖（flutter_plugin_android_lifecycle 等）
// 要求编译 API 36+ 的 AAR metadata 冲突。
subprojects {
    def fixCompileSdk = { proj ->
        def android = proj.extensions.findByName("android")
        if (android != null) {
            android.compileSdk = 36
            if (android.ndkVersion == null) {
                android.ndkVersion = "__NDK_VERSION__"
            }
        }
    }
    if (project.state.executed) {
        fixCompileSdk(project)
    } else {
        afterEvaluate { fixCompileSdk(it) }
    }
}

